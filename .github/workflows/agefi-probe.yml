name: Probe Agefi RSS source

on:
  workflow_dispatch:
  push:
    paths:
      - "agefi_probe.py"
      - "agefi_feed.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Probe Agefi
        run: python agefi_probe.py

      - name: Build Agefi RSS
        run: python agefi_feed.py

      - name: Upload Agefi RSS test
        uses: actions/upload-artifact@v4
        with:
          name: agefi-rss-test
          path: feeds/agefi.xml
          retention-days: 2
