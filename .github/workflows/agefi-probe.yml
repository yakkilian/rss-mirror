name: Probe Agefi RSS source

on:
  workflow_dispatch:
  push:
    paths:
      - "agefi_probe.py"
      - "agefi_feed.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Probe Agefi
        run: python agefi_probe.py

      - name: Build Agefi RSS
        run: python agefi_feed.py

      - name: Commit Agefi RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/agefi.xml
          if git diff --cached --quiet; then
            echo "No Agefi feed changes"
          else
            git commit -m "Add Agefi RSS feed"
            git push
          fi
