name: ICTjournal news selection

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Fenêtre de collecte en heures"
        required: true
        default: "18"
        type: choice
        options:
          - "8"
          - "18"
          - "48"
      lot_id:
        description: "Identifiant du lot (optionnel)"
        required: false
        default: ""
        type: string


jobs:
  select-news:
    runs-on: ubuntu-latest

    steps:
      - name: Determine run parameters
        id: params
        shell: bash
        run: |
          DATE_LOCAL=$(TZ=Europe/Zurich date +%F)
          LOOKBACK="${{ inputs.lookback_hours }}"
          REQUESTED_LOT="${{ inputs.lot_id }}"

          if [ -n "$REQUESTED_LOT" ]; then
            LOT_ID="$REQUESTED_LOT"
          else
            LOT_ID="${DATE_LOCAL}-manual-${GITHUB_RUN_ID}"
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "lookback_hours=$LOOKBACK" >> "$GITHUB_OUTPUT"
          echo "lot_id=$LOT_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.params.outputs.should_run == 'true'
        uses: actions/checkout@v4


      - name: Set up Python
        if: steps.params.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        if: steps.params.outputs.should_run == 'true'
        run: |
          pip install requests feedparser trafilatura


      - name: Filter news
        if: steps.params.outputs.should_run == 'true'
        env:
          FRESHRSS_AUTO_SUISSE: ${{ secrets.FRESHRSS_AUTO_SUISSE }}
          FRESHRSS_AUTO_ICTJ_NEWS: ${{ secrets.FRESHRSS_AUTO_ICTJ_NEWS }}
          FRESHRSS_AUTO_ICT_BEST: ${{ secrets.FRESHRSS_AUTO_ICT_BEST }}
          FRESHRSS_AUTO_ICT: ${{ secrets.FRESHRSS_AUTO_ICT }}
          LOOKBACK_HOURS: ${{ steps.params.outputs.lookback_hours }}
        run: |
          python news_filter.py


      - name: Send candidates by email
        if: steps.params.outputs.should_run == 'true'
        env:
          SMTP_HOST: ${{ secrets.OVH_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.OVH_SMTP_PORT }}
          SMTP_USER: ${{ secrets.OVH_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.OVH_SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.ICTJ_MAIL_TO }}
          LOOKBACK_HOURS: ${{ steps.params.outputs.lookback_hours }}
          LOT_ID: ${{ steps.params.outputs.lot_id }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from pathlib import Path

          file_path = Path("output/candidates.json")

          if not file_path.exists():
              raise FileNotFoundError("output/candidates.json introuvable")

          lookback = os.environ["LOOKBACK_HOURS"]
          lot_id = os.environ["LOT_ID"]

          msg = EmailMessage()

          msg["Subject"] = (
              f"ICTJ_AUTO_CANDIDATES | {lot_id} | {lookback}h"
          )

          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["MAIL_TO"]

          msg.set_content(
              "Fichier candidates.json généré automatiquement "
              "par la veille GitHub ICTjournal.\n\n"
              f"Lot : {lot_id}\n"
              f"Fenêtre : {lookback} h\n"
          )

          msg.add_attachment(
              file_path.read_bytes(),
              maintype="application",
              subtype="json",
              filename="candidates.json"
          )

          host = os.environ["SMTP_HOST"]
          port = int(os.environ["SMTP_PORT"])
          context = ssl.create_default_context()

          with smtplib.SMTP(host, port, timeout=30) as smtp:
              smtp.ehlo()
              smtp.starttls(context=context)
              smtp.ehlo()
              smtp.login(
                  os.environ["SMTP_USER"],
                  os.environ["SMTP_PASSWORD"]
              )
              smtp.send_message(msg)

          print(
              f"E-mail envoyé avec candidates.json "
              f"({lot_id}, fenêtre {lookback} h)."
          )
          PY


      - name: Save results
        if: steps.params.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: news-selection-${{ steps.params.outputs.lot_id }}
          path: |
            output/candidates.json
            output/unresolved.json
          retention-days: 7
          if-no-files-found: warn
