name: News selection test

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Fenêtre de collecte en heures"
        required: true
        default: "18"
        type: choice
        options:
          - "8"
          - "18"
          - "48"

jobs:
  select-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests feedparser trafilatura

      - name: Filter news
        env:
          FRESHRSS_AUTO_SUISSE: ${{ secrets.FRESHRSS_AUTO_SUISSE }}
          FRESHRSS_AUTO_ICTJ_NEWS: ${{ secrets.FRESHRSS_AUTO_ICTJ_NEWS }}
          FRESHRSS_AUTO_ICT_BEST: ${{ secrets.FRESHRSS_AUTO_ICT_BEST }}
          FRESHRSS_AUTO_ICT: ${{ secrets.FRESHRSS_AUTO_ICT }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
        run: python news_filter.py

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: news-selection-results
          path: |
            output/candidates.json
            output/unresolved.json
