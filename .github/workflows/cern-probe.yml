name: Probe CERN news source

on:
  workflow_dispatch:
  push:
    paths:
      - "cern_probe.py"
      - "cern_feed.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Probe CERN
        run: python cern_probe.py

      - name: Build CERN RSS
        run: python cern_feed.py

      - name: Commit CERN RSS test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/cern.xml
          if git diff --cached --quiet; then
            echo "No CERN feed changes"
          else
            git commit -m "Add CERN RSS feed"
            git push
          fi
